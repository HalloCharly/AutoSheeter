;────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
; EXAMPLES
;
; ── REQUIRED SETTINGS ──────────────────────────────────────────────────────────────────────────────────────────────────────────────────
;
;   [GoogleSheets]
;   json_file_name = myproject-abc123.json
;     -> Name of your Google service-account JSON file, placed in ./extra/
;
;   spreadsheet_id = 1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms
;     -> The long ID from your Google Sheets URL:
;        https://docs.google.com/spreadsheets/d/<spreadsheet_id>/edit
;
;   target_sheet = test
;     -> Exact name of the tab inside the spreadsheet.
;
;   [Sheet]
;   start_row = 2
;     -> The first row to import data (usually 3 or 4).
;
; ── COLUMN LETTERS ──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
;
;   Every field in [Columns] maps a stat to a spreadsheet column letter (or
;   letters for multi-column columns like AA, AB, ...).
;   Leave blank or write None to disable that field because then it will be skipped
;   entirely and the script will print a notice on startup.
;
;   Players = X, Y, Z, AA
;     -> Comma-separated list of column letters, one per player slot (left to
;        right). Column letters are sorted automatically so order in the list doesn't matter.
;     RECOMMENDED: Put in 4 values, the programm will auto put in ONLY
;     for the amount of players in the run automatically.
;
; ── WHAT EACH COLUMN WRITES ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
;
;   NewQuota: Plain number. Written only on Gordion/sell runs.
;
;   MoonInfo_Name: Moon name of the current moon.
;
;   MoonInfo_Weather: Current weather on the current moon.
;
;   DungeonInfo_Interior: Interior type of the current dungeon.
;
;   DungeonInfo_ItemCount: Total number of scrap items spawned in the dungeon.
;
;   BeehiveCollected: The amount of beehives collected.
;                     ->Example: Available: 2|1, Collected 1|1 (missed 1 close bee)
;
;   BeehiveAmount: Amount of close and far bees (min value and max value bees)
;                  Two numbers separated by | : amount of min value hives | amount of max value hives.
;                  ->Example: [50, 101, 101] -> 1|2 ; [80, 80] -> 2|0
;
;   BeehiveValue: Two numbers separated by | : value of min value hives | value of max value hives.
;                 ->Example: [50, 101, 101] -> 50|101 ; [80, 80] -> 80|0
;
;   EggValue: The values of the eggs from sapsucker.
;             ->Example: 80|95|110 (always 3 values, from lowest to highest)
;
;   OutsideItemsValue: Gives the total amount collected value from outside items (bees, eggs), and puts a note with the missing bees and eggs.
;                      ->Example: Bees: avb.: 2|1 50|80 col.: 1|1 ; Eggs: 80|90|100 col.: 80|90 -> +300 Note: [Missed: Bees 1|0 Eggs (100)]
;
;   KnifeInfo: Number of Butlers spawned during the day.
;
;   ShotgunInfo: Number of Nutcrackers spawned during the day.
;
;   CollectedTotal: Total scrap value collected after the day. (hense top line)
;
;   BottomLine: Total available scrap at the end of the day (hense bottom line)
;
;   Scan: Writes the amount of items missed and puts in a note with what items youve missed.
;         ->Example cell value: 2 Note: [Robot Toy: 70 ; V-Type Engine: 48]        
;
;   ValueSold: Amount sold on company (only entered when you make quota).
;
;   SID: If there is an SID (Single Item Day), then it will check the box "TRUE" and write a note with the item name of the SID.
;        ->Example: "TRUE" Note: [Candy]
;
;   Infestation: If there is an infestation, it will check the box "TRUE" and write a note with the infestation type.
;                ->Example: "TRUE" Note: [Nutcracker]
;
;   AppyLess: If Apparatus did not spawn, it will check the box "TRUE". Else if it did, it stays "FALSE".
;
;   IndoorFog: If there is indoor fog, it will check the box "TRUE".
;
;   MeteorShower: If there is a meteor shower, it will check the box "TRUE".
;
;   GiftBoxes: If you collected any, it will tell you if youve made plus or minus (value of the scrap inside - gift box value)
;              and will write a note with the missed gift boxes with their values and the values of the scrap inside.
;              ->Example cell value: +56 [Gift Box: 24 ; Scrap inside: 80] ; -8 [Gift Box: 23 ; Scrap inside: 15]
;
;   Seed: The seed of the day.
;
;   Players: If there is more than 1 player, it will sort the death tracking by their steam id, from lowest to highest.
;            (So that players can change their display name without changing the order in which the tracking was done.)
;            Puts in "X" if the person died and puts a note with Cause of death and Time of death.
;            Puts in "S" if the person survived till the end of the day.
;            Puts in "M" if the Cause of death == Abandoned (so whenever you go missing).
;            Puts in "DC" if the person disconnected. (Except host, duh).
;            Puts in "SX" (safe death) if the person died after 10:45PM and puts a note with Cause of death and Time of death.
;            ->Example: Players HalloCharly(2), Wafrody(1), Quazy(3) (Columns AA, AB, AC, AD) -> Wafrody->AA, HalloCharly->AB, Quazy->AC
;────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
